[project]
name = "vijaykrsha-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy[asyncio]",
    "asyncpg",
    "alembic",
    "pydantic-settings",
    "pydantic[email]",
    "argon2-cffi",
    "pyotp",
    "cryptography",
    "boto3",
    "httpx",
    "python-multipart",
    "structlog",
    "redis[hiredis]>=5.0.0",
    "user-agents",
    "pyjwt[crypto]>=2.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
]
# Offline compression benchmark only (benchmarks/compression_bench.py). These are
# NEVER runtime dependencies: the API ships uncompressed and neither br nor zstd
# is used on the request path. Kept separate from `dev` because python-snappy
# needs a system libsnappy and would otherwise break plain test installs.
bench = [
    "zopfli",
    "lz4",
    "python-snappy",
    "brotli",
    "zstandard",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
