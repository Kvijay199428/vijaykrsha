# -- Accept-Encoding content negotiation for favicon/icon files ---------
# Inspects the client's Accept-Encoding header during the HTTP handshake
# and selects the best compression sidecar: brotli > gzip > none.
# The result populates $icon_suffix (e.g. ".br") and $icon_encoding
# (e.g. "br") for use in the favicon/icon location block below.
#
# NOTE: zstd was intentionally removed from these maps. The build never
# produces .zst sidecars (no fzstd dependency), so the map could advertise
# an encoding whose sidecar does not exist. try_files then fell back to the
# raw file while server-level gzip_static served the .gz — and the
# unconditional add_header Content-Encoding still emitted "zstd", yielding
# TWO conflicting Content-Encoding headers. Browsers failed with
# ERR_CONTENT_DECODING_FAILED on every icon. Priority is now br > gzip >
# identity; .br/.gz sidecars are guaranteed by verify:compress in the image
# build. See docs/compression.md.
map $http_accept_encoding $icon_suffix {
    default         "";
    "~*br"          ".br";
    "~*gzip"        ".gz";
}
map $http_accept_encoding $icon_encoding {
    default         "";
    "~*br"          "br";
    "~*gzip"        "gzip";
}
# Content-Type for icon responses. nginx looks up the MIME type by the
# extension of the file it actually serves — for sidecars that is .br/.gz,
# which matches nothing (default_type does NOT interpolate variables; it
# literally sent "$icon_type" as the type). So the types table in the icon
# location is cleared and ONE Content-Type is added here from this map.
# Patterns are deliberately unanchored: when try_files serves the sidecar,
# $uri is the SIDECAR path (favicon.svg.br), so both favicon.svg and
# favicon.svg.br must match "\.svg".
map $uri $icon_type {
    default                "application/octet-stream";
    "~*\.svg"              "image/svg+xml";
    "~*\.png"              "image/png";
    "~*\.ico"              "image/x-icon";
    "~*\.webmanifest"      "application/manifest+json";
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;
    # Vary: Accept-Encoding so caches key on the negotiation result.
    gzip_vary on;
    # Serve the precompressed .gz emitted when VITE_PRECOMPRESS=1 (Docker/dev
    # builds) instead of compressing on every request. Requires
    # http_gzip_static_module (`nginx -V | grep gzip_static`); the stock
    # nginx:1.27-alpine image includes it. Brotli/zstd are handled by the
    # Cloudflare edge, not here — except for favicon/icon files which have
    # dedicated .br/.zst sidecars (see below). See docs/compression.md.
    gzip_static on;

    # --- Security headers ---
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://challenges.cloudflare.com wss://vega-api.vijaykrsha.online; frame-src 'self' https://challenges.cloudflare.com; media-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

    # Dev-container parity with the Cloudflare Pages function: /api/* is
    # proxied to the backend with the /api prefix stripped, and the
    # X-Forwarded-By header satisfies DirectAccessGuard.
    location /api/ {
        proxy_pass http://backend-dev:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header X-Forwarded-By pages-proxy;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        client_max_body_size 160m;
    }

    location /ws/ {
        proxy_pass http://backend-dev:8000/ws/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header X-Forwarded-By pages-proxy;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    # --- Favicon / Icon / Manifest: Accept-Encoding content negotiation ---
    # Serves pre-compressed sidecars (.br / .gz) for favicon, icon,
    # apple-touch-icon, and webmanifest files. The $icon_suffix and
    # $icon_encoding map variables (defined above the server block) select
    # the best encoding the client advertised in Accept-Encoding.
    #
    # try_files order: compressed sidecar first, then uncompressed original.
    # If the client supports none of gz/br, $icon_suffix is "" and
    # try_files falls through to $uri (the uncompressed file).
    location ~ ^/(favicon\.(png|svg|ico)|apple-touch-icon\.png|icon\d+\.png|site\.webmanifest)$ {
        # Disable dynamic gzip — we are serving a pre-compressed sidecar or
        # the raw file; re-compressing either would corrupt the response.
        gzip off;
        # Also disable gzip_STATIC here: this location already serves the
        # .gz sidecar explicitly via try_files when the map picks gzip. If
        # gzip_static stayed on and try_files ever fell back to the raw
        # file, gzip_static would serve the .gz with its own
        # Content-Encoding: gzip header while add_header below emitted the
        # map's encoding too — two conflicting Content-Encoding headers and
        # ERR_CONTENT_DECODING_FAILED in browsers. Belt and braces: only the
        # map decides the encoding in this location.
        gzip_static off;

        # Serve the best sidecar the client supports, or the original.
        try_files $uri$icon_suffix $uri =404;

        # --- Content-Type for sidecar responses -------------------------
        # nginx derives Content-Type from the FILE it serves; sidecars
        # (favicon.svg.br) match no types entry by their .br/.gz extension,
        # and default_type does NOT interpolate variables (it would send the
        # literal string "$icon_type"). So: clear the types table and set an
        # empty default_type — the module then emits no Content-Type at all
        # (nginx skips the header when the resolved type is empty) — and add
        # exactly one Content-Type ourselves from the map on the ORIGINAL
        # $uri, which is unchanged by try_files.
        types { }
        default_type "";
        add_header Content-Type $icon_type always;

        # Tell the client (and Cloudflare) which encoding the body uses.
        # When $icon_encoding is "" (no compression), the header is empty
        # and nginx omits it — exactly the right behaviour for identity.
        add_header Content-Encoding $icon_encoding;
        add_header Vary "Accept-Encoding" always;

        # Icons change rarely; 1-week cache with revalidation.
        add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400";

        # Repeat security headers (nginx drops parent add_header in locations).
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://challenges.cloudflare.com wss://vega-api.vijaykrsha.online; frame-src 'self' https://challenges.cloudflare.com; media-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    }

    location / {
        # HTML documents and SPA fallback must never be cached: prevents the
        # Back button restoring an authenticated admin view after logout.
        add_header Cache-Control "no-store" always;
        # nginx discards ALL parent-level add_header directives when a location
        # defines its own, so repeat the security header set here explicitly.
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://challenges.cloudflare.com wss://vega-api.vijaykrsha.online; frame-src 'self' https://challenges.cloudflare.com; media-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
        try_files $uri $uri/ /index.html;
    }

    # Static assets are content-hashed by Vite, so immutable caching is safe.
    # Security headers are repeated here: nginx does not merge add_header
    # directives from parent blocks when a location defines its own.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://challenges.cloudflare.com wss://vega-api.vijaykrsha.online; frame-src 'self' https://challenges.cloudflare.com; media-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    }
}
