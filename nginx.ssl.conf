# Dev-only HTTPS vhost for frontend-dev (no cloudflared / public tunnel).
#
# Shipping strategy: the Dockerfile bakes nginx.conf in as default.conf, so the
# 443 server CANNOT live there (nginx refuses to boot when ssl_certificate files
# are missing — that would break any frontend image built without a cert).
# Instead this file is injected at runtime, only by docker-compose.dev.yml,
# into /etc/nginx/conf.d/ssl.conf. The base nginx image glob-includes
# conf.d/*.conf: no mount -> no TLS (standalone/prod images unaffected);
# mount present -> 443 listener. Cert/key are mounted from ./dev-tls
# (gitignored; generated with mkcert, SANs localhost/127.0.0.1/::1/192.168.1.50).

# Redact query strings from access logs. The session WebSocket carries its
# single-use ticket in the query string (?ticket=...); the ticket is short-lived
# and hashed at rest, but there is no reason to persist it in plaintext logs.
# $uri is the request path without the query string. Defined here (not in
# default.conf) to avoid defining this format twice in the same http context.
log_format vks_redacted '$remote_addr - $remote_user [$time_local] '
                        '"$request_method $uri $server_protocol" '
                        '$status $body_bytes_sent "$http_referer" '
                        '"$http_user_agent"';

# -- Accept-Encoding content negotiation for favicon/icon files ---------
# See the long NOTE in nginx.conf: zstd was removed from these maps because
# the build never produces .zst sidecars, and advertising it caused nginx to
# emit two conflicting Content-Encoding headers (map "zstd" + gzip_static's
# "gzip") -> ERR_CONTENT_DECODING_FAILED in browsers. Priority: br > gzip >
# identity. Keep both files' maps in sync.
map $http_accept_encoding $icon_suffix {
    default         "";
    "~*br"          ".br";
    "~*gzip"        ".gz";
}
map $http_accept_encoding $icon_encoding {
    default         "";
    "~*br"          "br";
    "~*gzip"        "gzip";
}
# Content-Type for icon sidecars (.br/.gz match no types entry; nginx looks
# up the MIME type by the served file's extension). Patterns are
# unanchored because when try_files serves the sidecar, $uri is the
# SIDECAR path (favicon.svg.br). See nginx.conf — keep both files in sync.
map $uri $icon_type {
    default                "application/octet-stream";
    "~*\.svg"              "image/svg+xml";
    "~*\.png"              "image/png";
    "~*\.ico"              "image/x-icon";
    "~*\.webmanifest"      "application/manifest+json";
}

server {
    listen 443 ssl http2;
    root /usr/share/nginx/html;
    index index.html;

    ssl_certificate     /etc/nginx/dev-tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/dev-tls/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/access.log vks_redacted;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;
    # Vary: Accept-Encoding so caches key on the negotiation result.
    gzip_vary on;
    # Serve precompressed .gz (VITE_PRECOMPRESS=1) via http_gzip_static_module.
    # Brotli/zstd are the Cloudflare edge's job, not this origin's — except for
    # favicon/icon files which have dedicated .br/.zst sidecars (see below).
    gzip_static on;

    # --- Security headers ---
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://challenges.cloudflare.com wss://vega-api.vijaykrsha.online; frame-src 'self' https://challenges.cloudflare.com; media-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

    # Same /api passthrough as the :80 vhost, but advertises https upstream so
    # the backend builds correct absolute URLs / WS origins.
    location /api/ {
        proxy_pass http://backend-dev:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-By pages-proxy;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        client_max_body_size 160m;
    }

    location /ws/ {
        proxy_pass http://backend-dev:8000/ws/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-By pages-proxy;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    # --- Favicon / Icon / Manifest: Accept-Encoding content negotiation ---
    location ~ ^/(favicon\.(png|svg|ico)|apple-touch-icon\.png|icon\d+\.png|site\.webmanifest)$ {
        gzip off;
        # See nginx.conf: gzip_static must not double-serve .gz with its own
        # Content-Encoding when try_files falls back to the raw file — that
        # produced conflicting headers and ERR_CONTENT_DECODING_FAILED.
        gzip_static off;
        try_files $uri$icon_suffix $uri =404;
        # Content-Type: default_type does NOT interpolate variables (it sent
        # the literal "$icon_type"). Clear the types table + empty
        # default_type so nginx emits no Content-Type, then add exactly one
        # from the map on the original $uri. See nginx.conf for details.
        types { }
        default_type "";
        add_header Content-Type $icon_type always;
        add_header Content-Encoding $icon_encoding;
        add_header Vary "Accept-Encoding" always;
        add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400";
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://challenges.cloudflare.com wss://vega-api.vijaykrsha.online; frame-src 'self' https://challenges.cloudflare.com; media-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    }

    location / {
        # HTML documents and SPA fallback must never be cached: prevents the
        # Back button restoring an authenticated admin view after logout.
        add_header Cache-Control "no-store" always;
        # nginx discards ALL parent-level add_header directives when a location
        # defines its own, so repeat the security header set here explicitly.
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://challenges.cloudflare.com wss://vega-api.vijaykrsha.online; frame-src 'self' https://challenges.cloudflare.com; media-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
        try_files $uri $uri/ /index.html;
    }

    # Static assets are content-hashed by Vite, so immutable caching is safe.
    # Security headers are repeated here: nginx does not merge add_header
    # directives from parent blocks when a location defines its own.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://challenges.cloudflare.com wss://vega-api.vijaykrsha.online; frame-src 'self' https://challenges.cloudflare.com; media-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    }
}